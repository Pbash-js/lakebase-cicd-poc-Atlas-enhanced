name: PR Validation — Lakebase branch
on:
  pull_request:
    paths: ["db/migrations/**", "db/schema/**", "db/objects/**", "db/tests/**", "scripts/**", "databricks.yml", ".github/workflows/**"]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      LAKEBASE_PROJECT: ${{ secrets.LAKEBASE_PROJECT }}
      DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
      ATLAS_EDITION: ${{ vars.ATLAS_EDITION || 'ce' }}
      ATLAS_TOKEN: ${{ vars.ATLAS_EDITION == 'pro' && secrets.ATLAS_TOKEN || '' }}
      ATLAS_BIN: ${{ vars.ATLAS_EDITION == 'pro' && 'atlas' || '/tmp/atlas' }}   # Pro: setup-atlas binary; CE: pinned download
    services:
      # Official Atlas CI pattern (atlasgo.io/guides/ci-platforms/github-versioned):
      # a throwaway postgres container serves as the dev-database for lint
      # analysis. Only used by the Pro lint step; idle under CE.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dev
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      pull-requests: write # comments the generated SQL on the PR; no contents:write — CI never commits
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}   # commit on the PR branch, not the merge ref
          fetch-depth: 0

      - name: Install Atlas CE (pinned)
        uses: ./.github/actions/setup-atlas

      # Pro mode: official Atlas Cloud integration — installs Atlas with the
      # bot token (grant cached for offline access) and posts a native lint
      # report on the PR. Skipped entirely under CE.
      - name: Atlas Cloud setup + native lint (Pro only)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}
      - name: Atlas Cloud lint report (Pro only)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/atlas-action/migrate/lint@v1
        with:
          dir: 'file://db/migrations'
          dev-url: 'postgres://postgres:pass@localhost:5432/dev?search_path=public&sslmode=disable'
          dir-name: 'lakebase-cicd-poc'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Infra-file integrity gate
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          git fetch -q origin "${BASE}"
          CHANGED=$(git --no-pager diff --no-renames --name-only "origin/${BASE}...HEAD" -- .github databricks.yml scripts)
          if [ -z "$CHANGED" ]; then
            echo "No infra/runner changes — gate passed"
            exit 0
          fi
          echo "Infra/runner files changed in this PR:"; echo "$CHANGED"
          case " $LABELS " in
            *" infra-approved "*) echo "infra-approved label present — gate passed"; exit 0;;
          esac
          echo "::error::PR touches .github/, scripts/ or databricks.yml — second-pair-of-eyes rule: add the 'infra-approved' label after review"
          exit 1

      - name: Migration immutability gate (generated files are never edited)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q origin "${BASE}"
          EXIT=0
          for f in $(git --no-pager diff --no-renames --name-only "origin/${BASE}...HEAD" -- db/migrations); do
            [ "$f" = "db/migrations/atlas.sum" ] && continue   # checksum file is rewritten by every generation; Atlas verifies it at apply time
            if git cat-file -e "origin/${BASE}:$f" 2>/dev/null; then
              echo "::error::$f already exists on the base branch: generated migrations are immutable — fix is a NEW migration (edit db/schema/schema.sql and regenerate)"
              EXIT=1
            fi
          done
          exit $EXIT

      - name: Destructive-change gate (regex lint on NEW migrations; not a parser)
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          git fetch -q origin "${BASE}"
          EXIT=0
          for f in $(git --no-pager diff --no-renames --name-only "origin/${BASE}...HEAD" -- db/migrations); do
            [ "$f" = "db/migrations/atlas.sum" ] && continue
            git cat-file -e "origin/${BASE}:$f" 2>/dev/null && continue   # only NEW files
            if grep -inE 'DROP[[:space:]]+(TABLE|SCHEMA|COLUMN)|TRUNCATE([[:space:]]|;|$)' "$f"; then
              echo "::error::$f contains destructive DDL (DROP TABLE/SCHEMA/COLUMN, TRUNCATE): add the 'destructive-approved' label after review, or remove it"
              EXIT=1
            fi
            # CREATE INDEX CONCURRENTLY is impossible under --tx-mode all, so this warns only
            if grep -iE 'CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX' "$f" | grep -viqE 'CONCURRENTLY'; then
              echo "::warning::$f uses a non-concurrent CREATE INDEX: locks writes for the index build duration on large tables"
            fi
          done
          case " $LABELS " in
            *" destructive-approved "*) echo "destructive-approved label present — destructive DDL allowed"; EXIT=0;;
          esac
          exit $EXIT

      - name: Install Databricks CLI + Python deps
        uses: databricks/setup-cli@v1.22.1
        with:
          version: 1.17.0

      - name: Install Python deps
        run: pip3 install "psycopg[binary]==3.2.9" "pytest==8.3.5"

      # Environment-aware rehearsal: the PR's BASE branch selects the environment
      # via config/environments.yml (single source of truth); the rehearsal fork
      # comes off that environment's database. Non-baseline bases fall back to prod.
      - name: Resolve rehearsal environment from base branch
        env:
          BASE: ${{ github.base_ref }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip3 install -q "pyyaml==6.0.2"
          python3 scripts/resolve_env.py "$BASE" rehearsal

      - name: Recreate ephemeral PR branch (fresh fork of the environment database every run)
        env:
          PR_ID: ${{ github.event.pull_request.number }}
        run: |
          . scripts/lib.sh
          PR_BRANCH="pr-${PR_ID}"
          BR_PATH="projects/${LAKEBASE_PROJECT}/branches/${PR_BRANCH}"
          echo "▶ recreating ${PR_BRANCH} off current ${TARGET_BRANCH} (24h TTL)"
          lb_wait_branch_gone "$BR_PATH" || { echo "::error::old ${PR_BRANCH} did not delete in time"; exit 1; }
          lb_create_branch "$LAKEBASE_PROJECT" "$PR_BRANCH" "$TARGET_BRANCH" 86400
          # ACTIVE = ready; IDLE = suspended (scale-to-zero), wakes on first connection
          lb_wait_endpoint "${BR_PATH}/endpoints/primary" || { echo "::error::endpoint did not become ready"; exit 1; }

      - name: Atlas plan check (desired state vs migrations — FAIL on drift; CI never commits)
        env:
          PR_ID: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=$(./scripts/gen_migration.sh --check 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "✓ db/schema/schema.sql matches db/migrations"
            exit 0
          fi
          if [ "$RC" -ne 1 ]; then
            # Infra error (endpoint capacity, connectivity, lint failure) - NOT
            # schema drift. Never comment: a naive dev must not be told to
            # commit a spurious migration (verified failure mode, PR #10).
            echo "::error::plan check failed on an infra error (exit $RC) - retry the run; do NOT generate migrations for this"
            exit "$RC"
          fi
          # Drift (exit 1): FAIL the check. CI never commits: the dev runs
          # ./scripts/gen_migration.sh locally and commits the generated file.
          {
            echo "### Atlas plan check: db/schema/schema.sql drifted from db/migrations"
            echo ""
            echo "Run \`./scripts/gen_migration.sh\` locally, commit the generated file, and push. Planned SQL:"
            echo ""
            echo '```sql'
            printf '%s\n' "$OUT" | sed -n '/-- .*--/,$p' | head -200
            echo '```'
          } > plan.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file plan.md || true
          echo "::error::plan drift: schema.sql is not covered by db/migrations - generate locally and commit (see the PR comment)"
          exit 1

      - name: Run Migrations (Atlas apply — exactly-once)
        env:
          TARGET_BRANCH: pr-${{ github.event.pull_request.number }}
          TEST_SUITE: all
        run: ./scripts/branch_test.sh
