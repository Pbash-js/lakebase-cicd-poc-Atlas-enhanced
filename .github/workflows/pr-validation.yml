name: PR Validation — Lakebase branch
on:
  pull_request:
    paths: ["db/migrations/**", "db/schema/**", "db/objects/**", "db/rbac/**", "db/tests/**", "scripts/**", "databricks.yml", ".github/workflows/**"]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Atlas CE auto-generates migrations and commits them to the PR branch
      pull-requests: write # and comments the generated SQL on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}   # commit on the PR branch, not the merge ref
          fetch-depth: 0

      - name: Infra-file integrity gate
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          git fetch -q origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- .github databricks.yml scripts)
          if [ -z "$CHANGED" ]; then
            echo "No infra/runner changes — gate passed"
            exit 0
          fi
          echo "Infra/runner files changed in this PR:"; echo "$CHANGED"
          case " $LABELS " in
            *" infra-approved "*) echo "infra-approved label present — gate passed"; exit 0;;
          esac
          echo "::error::PR touches .github/, scripts/ or databricks.yml — second-pair-of-eyes rule: add the 'infra-approved' label after review"
          exit 1

      - name: Migration immutability gate (generated files are never edited)
        run: |
          git fetch -q origin ${{ github.base_ref }}
          EXIT=0
          for f in $(git diff --name-only origin/${{ github.base_ref }} HEAD -- db/migrations); do
            [ "$f" = "db/migrations/atlas.sum" ] && continue   # checksum file is rewritten by every generation; Atlas verifies it at apply time
            if git cat-file -e origin/${{ github.base_ref }}:"$f" 2>/dev/null; then
              echo "::error::$f already exists on the base branch: generated migrations are immutable — fix is a NEW migration (edit db/schema/schema.sql and regenerate)"
              EXIT=1
            fi
          done
          exit $EXIT

      - name: Install Databricks CLI + Python deps
        uses: databricks/setup-cli@main
        with:
          version: 1.17.0

      - name: Install Python deps
        run: pip3 install "psycopg[binary]" pytest

      - name: Provision Ephemeral PR Branch (idempotent — reuse on PR update)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          PR_ID: ${{ github.event.pull_request.number }}
        run: |
          PR_BRANCH="pr-${PR_ID}"
          if databricks postgres get-branch "projects/${{ secrets.LAKEBASE_PROJECT }}/branches/$PR_BRANCH" --output json >/dev/null 2>&1; then
            echo "Branch $PR_BRANCH already exists — reusing"
          else
            databricks postgres create-branch "projects/${{ secrets.LAKEBASE_PROJECT }}" "$PR_BRANCH" \
              --json '{"spec":{"source_branch":"projects/${{ secrets.LAKEBASE_PROJECT }}/branches/production","ttl":"86400s"}}'
          fi

      - name: Wait for Endpoint Readiness
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          PR_ID: ${{ github.event.pull_request.number }}
        run: |
          PR_BRANCH="pr-${PR_ID}"
          for i in $(seq 1 30); do
            STATE=$(databricks postgres get-endpoint \
              "projects/${{ secrets.LAKEBASE_PROJECT }}/branches/$PR_BRANCH/endpoints/primary" \
              --output json | jq -r '.status.current_state // empty')
            # ACTIVE = ready; IDLE = suspended (scale-to-zero), wakes on first connection
            [ "$STATE" = "ACTIVE" -o "$STATE" = "IDLE" ] && exit 0
            sleep 2
          done
          echo "Endpoint did not become ready" && exit 1

      - name: Atlas CE Plan (desired state vs migrations — auto-generate on drift)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          LAKEBASE_PROJECT: ${{ secrets.LAKEBASE_PROJECT }}
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
          PR_ID: ${{ github.event.pull_request.number }}
          ATLAS_BIN: /tmp/atlas
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL -o /tmp/atlas https://atlasbinaries.com/atlas/atlas-community-linux-amd64-latest
          chmod +x /tmp/atlas
          if OUT=$(./scripts/gen_migration.sh --check 2>&1); then
            echo "✓ db/schema/schema.sql matches db/migrations"
            exit 0
          fi
          echo "$OUT"
          # Drift: generate the migration here, commit it to the PR branch,
          # comment, and re-run. The dev only edits schema.sql and pushes.
          F=$(TARGET_BRANCH="pr-${{ github.event.pull_request.number }}" ./scripts/gen_migration.sh atlas_planned 2>&1 | grep -oE '[0-9]{14}_[a-z0-9_]+\.sql' | tail -1 || true)
          NEWFILE="db/migrations/$F"
          if [ -z "$F" ] || [ ! -f "$NEWFILE" ]; then
            echo "::error::plan drift detected but generation failed:"
            cat "$OUT"
            exit 1
          fi
          git config user.name "atlas-ce-bot"
          git config user.email "atlas-ce-bot@users.noreply.github.com"
          git add db/migrations
          git commit -m "Atlas CE: generate migration from db/schema/schema.sql"
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }} || echo "push failed (concurrent update) — next run re-plans"
          {
            echo "### Atlas CE auto-generated a migration"
            echo ""
            echo "Committed \`${NEWFILE}\` to this PR from \`db/schema/schema.sql\`. Planned SQL:"
            echo ""
            echo '```sql'
            sed -n '1,200p' "$NEWFILE"
            echo '```'
            echo ""
            echo "_Validation continues below with this file applied to the PR branch._"
          } > plan.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file plan.md || true
          exit 0

      - name: Run Migrations (Atlas CE apply — exactly-once)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          LAKEBASE_PROJECT: ${{ secrets.LAKEBASE_PROJECT }}
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
          TARGET_BRANCH: pr-${{ github.event.pull_request.number }}
          ATLAS_BIN: /tmp/atlas
        run: ./scripts/deploy_db.sh
