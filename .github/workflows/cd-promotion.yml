name: CD Promotion — replay to production
on:
  push:
    branches: [main]
    paths: ["db/migrations/**", "db/schema/**", "db/objects/**", "db/rbac/**", "databricks.yml", ".github/workflows/**"]
concurrency:
  group: cd-production
  cancel-in-progress: false   # serialize production migrations — never race

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production   # put required reviewers here
    permissions:
      id-token: write         # OIDC: exchange the GitHub JWT for a Databricks token (SP-CD)
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 1.17.0

      - name: Install Python deps
        run: pip3 install "psycopg[binary]" pytest

      - name: Deploy Infrastructure Assets via DABs
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_CLIENT_ID: ${{ vars.SP_CD_CLIENT_ID }}
        run: databricks bundle deploy -t prod

      - name: Install Atlas CE (pinned)
        run: |
          curl -sSfL -o /tmp/atlas https://atlasbinaries.com/atlas/atlas-community-linux-amd64-v1.3.5
          chmod +x /tmp/atlas

      - name: Pre-deploy recovery branch (PITR fork of production)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_CLIENT_ID: ${{ vars.SP_CD_CLIENT_ID }}
          LAKEBASE_PROJECT: ${{ secrets.LAKEBASE_PROJECT }}
        run: |
          RB="recovery-${{ github.run_id }}"
          BR_PATH="projects/${{ secrets.LAKEBASE_PROJECT }}/branches/${RB}"
          echo "▶ creating ${RB} off production (24h TTL) — rollback point for this deploy"
          databricks postgres delete-branch "$BR_PATH" 2>/dev/null || true
          for i in $(seq 1 15); do
            databricks postgres get-branch "$BR_PATH" --output json >/dev/null 2>&1 || break
            [ "$i" = 15 ] && { echo "::error::stale ${RB} did not delete in time"; exit 1; }
            sleep 2
          done
          databricks postgres create-branch "projects/${{ secrets.LAKEBASE_PROJECT }}" "$RB" \
            --json '{"spec":{"source_branch":"projects/${{ secrets.LAKEBASE_PROJECT }}/branches/production","ttl":"86400s"}}'
          echo "recovery_branch=${RB}" >> "$GITHUB_OUTPUT"
        id: recovery

      - name: Apply Migrations + Objects to Production (Atlas-native ledger, exactly-once)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_CLIENT_ID: ${{ vars.SP_CD_CLIENT_ID }}
          LAKEBASE_PROJECT: ${{ secrets.LAKEBASE_PROJECT }}
          DATABRICKS_PG_USER: ${{ vars.SP_CD_CLIENT_ID }}
          TARGET_BRANCH: production
          ATLAS_BIN: /tmp/atlas
        run: ./scripts/deploy_db.sh
