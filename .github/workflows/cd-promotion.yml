name: CD Promotion — branch-driven workspace promotion
on:
  push:
    branches: [dev, qa, "release/**", prod]
    paths: ["db/migrations/**", "db/schema/**", "db/objects/**", "databricks.yml", "config/**", "scripts/**", ".github/**"]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Rehearsal branch to deploy to instead of the environment database (Atlas-native path test). NEVER an environment database name."
        required: false
        default: ""

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false   # serialize per-environment promotions — never race

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.res.outputs.env_name }}
      deploy_env: ${{ steps.res.outputs.deploy_env }}
      host_name: ${{ steps.res.outputs.host_name }}
      token_name: ${{ steps.res.outputs.token_name }}
      project: ${{ steps.res.outputs.project }}
      database: ${{ steps.res.outputs.database }}
      bundle_target: ${{ steps.res.outputs.bundle_target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip3 install "pyyaml==6.0.2"
      - name: Resolve environment from config/environments.yml
        id: res
        env:
          GH_OUTPUTS: "1"
          # every host/token secret pair the config may reference; add one
          # line per new workspace (see config/environments.yml header)
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python3 scripts/resolve_env.py "$GITHUB_REF_NAME" cd

  promote:
    needs: resolve
    runs-on: ubuntu-latest
    # deploy gate: the GitHub environment named in config/environments.yml
    # ("" for dev/qa = deploy on merge; stage/production carry required reviewers)
    environment: ${{ needs.resolve.outputs.deploy_env }}
    permissions:
      contents: read
    env:
      WORKSPACE: ${{ needs.resolve.outputs.env_name }}
      LAKEBASE_PROJECT: ${{ needs.resolve.outputs.project }}
      TARGET_BRANCH: ${{ needs.resolve.outputs.database }}
      BUNDLE_TARGET: ${{ needs.resolve.outputs.bundle_target }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Select the workspace credentials BY NAME (config stores secret names,
      # not values). With one workspace all rows resolve to the same pair;
      # per-workspace pairs activate by adding the secrets + config edit.
      - name: Select workspace credentials
        run: |
          HOST="$(printenv "${{ needs.resolve.outputs.host_name }}")"
          TOKEN="$(printenv "${{ needs.resolve.outputs.token_name }}")"
          if [ -z "$HOST" ] || [ -z "$TOKEN" ]; then
            echo "::error::workspace credentials for $WORKSPACE not available (host=${{ needs.resolve.outputs.host_name }})"
            exit 1
          fi
          echo "DATABRICKS_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DATABRICKS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # Pro mode: official Atlas install with the bot token (grant cached for
      # offline access). The script steps use this binary via ATLAS_BIN.
      - name: Atlas Cloud setup (Pro only)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}

      - name: Validate target branch input (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TB_IN: ${{ github.event.inputs.target_branch }}   # never interpolate inputs into shell
        run: |
          TB="$TB_IN"
          if [ -z "$TB" ] || ! echo "$TB" | grep -qE '^[a-z][a-z0-9-]{0,62}$'; then
            echo "::error::manual runs must pass a rehearsal branch (^[a-z][a-z0-9-]{0,62}$) — never an environment database"
            exit 1
          fi
          echo "TARGET_BRANCH=$TB" >> "$GITHUB_ENV"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.22.1
        with:
          version: 1.17.0

      - name: Install Python deps
        run: pip3 install "psycopg[binary]==3.2.9" "pytest==8.3.5"

      - name: Deploy Infrastructure Assets via DABs
        env:
          ATLAS_EDITION: ${{ vars.ATLAS_EDITION || 'ce' }}
          ATLAS_TOKEN: ${{ vars.ATLAS_EDITION == 'pro' && secrets.ATLAS_TOKEN || '' }}
        run: databricks bundle deploy -t "$BUNDLE_TARGET"

      - name: Install Atlas CE (pinned)
        uses: ./.github/actions/setup-atlas

      # Pro mode: push the migration dir to the Atlas Cloud Schema
      # Registry (official CI guide step 2) so every deploy is versioned in
      # the cloud. Skipped under CE.
      - name: Push migration dir to Atlas Cloud registry (Pro only)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/atlas-action/migrate/push@v1
        with:
          dir: 'file://db/migrations'
          dev-url: 'docker://postgres/17/dev?search_path=public'
          dir-name: 'lakebase-cicd-poc'

      # Credential minting — the established Lakebase service-principal pattern:
      # long-lived SP OAuth secret -> 1h workspace token -> 1h database
      # credential, username = SP client id = the SP's Postgres role.
      - name: Mint Lakebase database credential (1-hour OAuth)
        id: cred
        env:
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
        run: |
          . scripts/lib.sh
          EP="projects/${LAKEBASE_PROJECT}/branches/${TARGET_BRANCH}/endpoints/primary"
          HOST=$(lb_host "$EP")
          TOK=$(lb_token "$EP")
          echo "::add-mask::${TOK}"
          ENC=$(python3 -c "import urllib.parse;print(urllib.parse.quote('${{ secrets.DATABRICKS_PG_USER }}', safe=''))")
          echo "url=postgres://${ENC}:${TOK}@${HOST}:5432/databricks_postgres?sslmode=require" >> "$GITHUB_OUTPUT"

      - name: Pre-deploy recovery branch (PITR fork of the environment database)
        if: env.TARGET_BRANCH == 'production'
        env:
          ATLAS_EDITION: ${{ vars.ATLAS_EDITION || 'ce' }}
          ATLAS_TOKEN: ${{ vars.ATLAS_EDITION == 'pro' && secrets.ATLAS_TOKEN || '' }}
        run: |
          . scripts/lib.sh
          RB="recovery-${{ github.run_id }}"
          BR_PATH="projects/${LAKEBASE_PROJECT}/branches/${RB}"
          echo "▶ creating ${RB} off production (24h TTL) — rollback point for this deploy"
          lb_wait_branch_gone "$BR_PATH" || { echo "::error::stale ${RB} did not delete in time"; exit 1; }
          lb_create_branch "$LAKEBASE_PROJECT" "$RB" production 86400
          echo "recovery_branch=${RB}" >> "$GITHUB_OUTPUT"
        id: recovery

      # Pro track: the OFFICIAL Atlas apply action against the minted
      # credential — Atlas owns the deployment, not our wrapper.
      - name: Apply migrations via the official Atlas action (Pro track)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/atlas-action/migrate/apply@v1
        with:
          dir: 'file://db/migrations'
          url: '${{ steps.cred.outputs.url }}'
          tx-mode: all   # one transaction for the whole pending batch (CE script parity)

      - name: Replay objects + run smoke tests (Pro track)
        if: vars.ATLAS_EDITION == 'pro'
        env:
          ATLAS_EDITION: pro
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
          ATLAS_BIN: ${{ vars.ATLAS_EDITION == 'pro' && 'atlas' || '/tmp/atlas' }}   # Pro: setup-atlas binary; CE: pinned download
          SKIP_MIGRATIONS: "1"
        run: ./scripts/branch_test.sh

      # CE track (fallback): our script — same ledger, --tx-mode all,
      # objects replay, tests, one entrypoint.
      - name: Apply migrations + objects (CE track)
        if: vars.ATLAS_EDITION != 'pro'
        env:
          ATLAS_EDITION: ce
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
          ATLAS_BIN: ${{ vars.ATLAS_EDITION == 'pro' && 'atlas' || '/tmp/atlas' }}   # Pro: setup-atlas binary; CE: pinned download
        run: ./scripts/branch_test.sh
