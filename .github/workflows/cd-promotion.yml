name: CD Promotion — branch-driven workspace promotion
on:
  push:
    branches: [dev, qa, "release/**", prod]
    paths: ["db/migrations/**", "db/schema/**", "db/objects/**", "databricks.yml", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Rehearsal branch to deploy to instead of the workspace baseline (Atlas-native path test). NEVER a baseline name."
        required: false
        default: ""

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false   # serialize per-workspace promotions — never race

jobs:
  promote:
    runs-on: ubuntu-latest
    # deploy gate: prod requires the production environment reviewers;
    # stage requires the stage environment reviewers. dev/qa deploy on merge.
    environment: ${{ github.ref_name == 'prod' && 'production' || (startsWith(github.ref_name, 'release/') && 'stage' || '') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Branch -> workspace map (single source of truth; mirrors DESIGN.md):
      #   dev          -> Dev workspace,   bundle target dev
      #   qa           -> QA workspace,    bundle target qa
      #   release/x.y  -> Stage workspace, bundle target stage
      #   prod         -> Prod workspace,  bundle target prod
      - name: Resolve workspace from branch
        run: |
          case "$GITHUB_REF_NAME" in
            dev)          WS=dev;    TARGET=dev ;;
            qa)           WS=qa;     TARGET=qa ;;
            release/*)    WS=stage;  TARGET=stage ;;
            prod)         WS=prod;   TARGET=prod ;;
            *) echo "::error::unmapped branch $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "WORKSPACE=$WS" >> "$GITHUB_ENV"
          echo "BUNDLE_TARGET=$TARGET" >> "$GITHUB_ENV"

      # Pro mode: official Atlas install with the bot token (grant cached for
      # offline access). The script steps use this binary via ATLAS_BIN.
      - name: Atlas Cloud setup (Pro only)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}

      - name: Resolve target branch
        env:
          TB_IN: ${{ github.event.inputs.target_branch }}   # never interpolate inputs into shell
        run: |
          TB="$TB_IN"
          if [ -n "$TB" ] && ! echo "$TB" | grep -qE '^[a-z][a-z0-9-]{0,62}$'; then
            echo "::error::invalid target_branch (must match ^[a-z][a-z0-9-]{0,62}$)"; exit 1
          fi
          # push events deploy to the workspace's Lakebase baseline branch
          if [ -z "$TB" ]; then TB="production"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$TB" = "production" ]; then
            echo "::error::manual runs never touch a workspace baseline — pass a rehearsal branch"
            exit 1
          fi
          echo "TARGET_BRANCH=$TB" >> "$GITHUB_ENV"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.22.1
        with:
          version: 1.17.0

      - name: Install Python deps
        run: pip3 install "psycopg[binary]==3.2.9" "pytest==8.3.5"

      # Workspace Lakebase project: LAKEBASE_PROJECT (prod) is a secret;
      # the dev/qa/stage projects are repo variables, set when those
      # workspaces are provisioned. A placeholder skips the workspace's
      # Lakebase steps with a notice instead of failing the pipeline.
      - name: Resolve workspace Lakebase project
        run: |
          case "$WORKSPACE" in
            prod)  P="${{ secrets.LAKEBASE_PROJECT }}" ;;
            dev)   P="${{ vars.LAKEBASE_PROJECT_DEV }}" ;;
            qa)    P="${{ vars.LAKEBASE_PROJECT_QA }}" ;;
            stage) P="${{ vars.LAKEBASE_PROJECT_STAGE }}" ;;
          esac
          if [ -z "$P" ]; then
            echo "::notice::$WORKSPACE workspace Lakebase project not provisioned yet — Lakebase steps will be skipped"
            echo "PROJECT=" >> "$GITHUB_ENV"
          else
            echo "PROJECT=$P" >> "$GITHUB_ENV"
          fi

      - name: Deploy Infrastructure Assets via DABs
        if: env.PROJECT != ''
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ATLAS_EDITION: ${{ vars.ATLAS_EDITION || 'ce' }}
          ATLAS_TOKEN: ${{ vars.ATLAS_EDITION == 'pro' && secrets.ATLAS_TOKEN || '' }}
        run: databricks bundle deploy -t "$BUNDLE_TARGET"

      - name: Install Atlas CE (pinned)
        uses: ./.github/actions/setup-atlas

      # Pro mode: push the migration dir to the Atlas Cloud Schema
      # Registry (official CI guide step 2) so every deploy is versioned in
      # the cloud. Skipped under CE.
      - name: Push migration dir to Atlas Cloud registry (Pro only)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/atlas-action/migrate/push@v1
        with:
          dir: 'file://db/migrations'
          dev-url: 'docker://postgres/17/dev?search_path=public'
          dir-name: 'lakebase-cicd-poc'

      # Credential minting — the established Lakebase service-principal pattern:
      # long-lived SP OAuth secret -> 1h workspace token -> 1h database
      # credential, username = SP client id = the SP's Postgres role.
      - name: Mint Lakebase database credential (1-hour OAuth)
        id: cred
        if: env.PROJECT != ''
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          LAKEBASE_PROJECT: ${{ env.PROJECT }}
        run: |
          . scripts/lib.sh
          EP="projects/${LAKEBASE_PROJECT}/branches/${TARGET_BRANCH}/endpoints/primary"
          HOST=$(lb_host "$EP")
          TOK=$(lb_token "$EP")
          echo "::add-mask::${TOK}"
          ENC=$(python3 -c "import urllib.parse;print(urllib.parse.quote('${{ secrets.DATABRICKS_PG_USER }}', safe=''))")
          echo "url=postgres://${ENC}:***@${HOST}:5432/databricks_postgres?sslmode=require" >> "$GITHUB_OUTPUT"

      - name: Pre-deploy recovery branch (PITR fork of the workspace baseline)
        if: env.PROJECT != '' && env.TARGET_BRANCH == 'production'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ATLAS_EDITION: ${{ vars.ATLAS_EDITION || 'ce' }}
          ATLAS_TOKEN: ${{ vars.ATLAS_EDITION == 'pro' && secrets.ATLAS_TOKEN || '' }}
          LAKEBASE_PROJECT: ${{ env.PROJECT }}
        run: |
          . scripts/lib.sh
          RB="recovery-${{ github.run_id }}"
          BR_PATH="projects/${LAKEBASE_PROJECT}/branches/${RB}"
          echo "▶ creating ${RB} off production (24h TTL) — rollback point for this deploy"
          lb_wait_branch_gone "$BR_PATH" || { echo "::error::stale ${RB} did not delete in time"; exit 1; }
          lb_create_branch "$LAKEBASE_PROJECT" "$RB" production 86400
          echo "recovery_branch=${RB}" >> "$GITHUB_OUTPUT"
        id: recovery

      # Pro track: the OFFICIAL Atlas apply action against the minted
      # credential — Atlas owns the deployment, not our wrapper.
      - name: Apply migrations via the official Atlas action (Pro track)
        if: env.PROJECT != '' && vars.ATLAS_EDITION == 'pro'
        uses: ariga/atlas-action/migrate/apply@v1
        with:
          dir: 'file://db/migrations'
          url: '${{ steps.cred.outputs.url }}'
          tx-mode: all   # one transaction for the whole pending batch (CE script parity)

      - name: Replay objects + run smoke tests (Pro track)
        if: env.PROJECT != '' && vars.ATLAS_EDITION == 'pro'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ATLAS_EDITION: pro
          LAKEBASE_PROJECT: ${{ env.PROJECT }}
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          ATLAS_BIN: ${{ vars.ATLAS_EDITION == 'pro' && 'atlas' || '/tmp/atlas' }}   # Pro: setup-atlas binary; CE: pinned download
          SKIP_MIGRATIONS: "1"
        run: ./scripts/branch_test.sh

      # CE track (fallback): our script — same ledger, --tx-mode all,
      # objects replay, tests, one entrypoint.
      - name: Apply migrations + objects (CE track)
        if: env.PROJECT != '' && vars.ATLAS_EDITION != 'pro'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ATLAS_EDITION: ce
          LAKEBASE_PROJECT: ${{ env.PROJECT }}
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          ATLAS_BIN: ${{ vars.ATLAS_EDITION == 'pro' && 'atlas' || '/tmp/atlas' }}   # Pro: setup-atlas binary; CE: pinned download
        run: ./scripts/branch_test.sh
