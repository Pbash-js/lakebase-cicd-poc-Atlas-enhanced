name: Weekly Lakebase Branch GC
on:
  schedule: [{ cron: "0 3 * * 6" }]   # Saturdays 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
    steps:
      - name: Install Databricks CLI (pinned — postgres API surface changes across versions)
        uses: databricks/setup-cli@main
        with:
          version: 1.17.0

      - name: Delete orphaned PR branches
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          LAKEBASE_PROJECT: ${{ secrets.LAKEBASE_PROJECT }}
        run: |
          # CLI has no list-branches — use the Postgres REST API
          PAGE=$(curl -sS -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/postgres/projects/${{ secrets.LAKEBASE_PROJECT }}/branches")
          echo "$PAGE" | jq -r '.branches[].name' \
            | grep -E "/branches/pr-" \
            | while read -r B; do
                echo "Deleting orphan: $B"
                databricks postgres delete-branch "$B" || true
              done
