name: Schema Drift Monitor (scheduled)
on:
  schedule: [{ cron: "0 4 * * *" }]   # daily 04:00 UTC
  workflow_dispatch:

concurrency:
  group: schema-drift-monitor

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pro mode: official Atlas install with the bot token; CE uses the pinned download.
      - name: Atlas Cloud setup (Pro only)
        if: vars.ATLAS_EDITION == 'pro'
        uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}

      - name: Install Databricks CLI (pinned)
        uses: databricks/setup-cli@v1.22.1
        with:
          version: 1.17.0

      - name: Install Python deps
        run: pip3 install "psycopg[binary]==3.2.9"

      - name: Install Atlas CE (pinned)
        uses: ./.github/actions/setup-atlas

      - name: Resolve prod environment from config
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_CI }}   # resolver checks availability by NAME; monitor holds only the CI token
        run: |
          pip3 install -q "pyyaml==6.0.2"
          python3 scripts/resolve_env.py prod cd

      - name: Run drift probe (production vs Git)
        id: probe
        env:
          # the probe calls the databricks CLI: it needs the credentials the
          # resolve step resolved (this was missing and every run failed with
          # 'default auth: cannot configure default credentials')
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_CI }}
          SOURCE_BRANCH: ${{ env.TARGET_BRANCH }}   # the prod environment's database, from config
          ATLAS_EDITION: ${{ vars.ATLAS_EDITION || 'ce' }}
          ATLAS_TOKEN: ${{ vars.ATLAS_EDITION == 'pro' && secrets.ATLAS_TOKEN || '' }}
          DATABRICKS_PG_USER: ${{ secrets.DATABRICKS_PG_USER }}
          ATLAS_BIN: ${{ vars.ATLAS_EDITION == 'pro' && 'atlas' || '/tmp/atlas' }}   # Pro: setup-atlas binary; CE: pinned download
        run: |
          set +e
          ./scripts/check_drift.sh > drift_report.txt 2>&1
          RC=$?
          set -e
          # 0 = clean, 1 = drift, 2 = probe error (never drift)
          if [ "$RC" = "1" ]; then
            echo "drift=true"  >> "$GITHUB_OUTPUT"; echo "kind=drift" >> "$GITHUB_OUTPUT"
          elif [ "$RC" = "2" ]; then
            echo "drift=true"  >> "$GITHUB_OUTPUT"; echo "kind=error" >> "$GITHUB_OUTPUT"
          elif [ "$RC" = "0" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"; echo "kind=clean" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected exit code $RC"; exit 1
          fi
          cat drift_report.txt

      - name: Open or update the drift issue
        if: steps.probe.outputs.drift == 'true' && steps.probe.outputs.kind == 'drift'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Schema drift: production differs from Git"
          {
            echo "The scheduled drift probe found production diverging from Git."
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            echo "<details><summary>Drift report</summary>"
            echo ""
            echo '```'
            head -c 60000 drift_report.txt
            echo '```'
            echo "</details>"
          } > body.md
          NUM=$(gh issue list --label schema-drift --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label schema-drift
          fi

      - name: Probe error (not drift), open or update one issue
        if: steps.probe.outputs.drift == 'true' && steps.probe.outputs.kind == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Schema drift probe FAILED (auth/connectivity/replay error, not drift)"
          {
            echo "The drift probe errored instead of measuring. This is NOT drift."
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            echo "One issue per probe error is reused: this entry is the latest failing run."
          } > body.md
          NUM=$(gh issue list --label probe-error --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label probe-error
          fi

      - name: Fail the run on drift
        if: steps.probe.outputs.drift == 'true' && steps.probe.outputs.kind == 'drift'
        run: |
          echo "::error::drift detected between production and Git, see the schema-drift issue"
          exit 1
