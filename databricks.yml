bundle:
  name: lakebase-cicd-poc

# One bundle target per workspace; the CD workflow maps the git branch to the
# target (dev -> dev, qa -> qa, release/* -> stage, prod -> prod).
# Pattern per target: declare the branch + primary endpoint with
# replace_existing: true — DABs cannot adopt an existing postgres_project, so
# the project is never declared in the bundle; its id lives in
# config/environments.json (the single source of truth).
#
# Current topology (Free Edition): one workspace, one project, one long-lived
# Lakebase branch per environment (env-dev / env-qa / env-stage / production).
# Moving an environment to its own workspace/project = edit
# config/environments.json; when that happens, update the matching target's
# branch parent here too.

targets:
  dev:
    mode: development
    default: true
    resources:
      postgres_branches:
        dev_branch:
          parent: projects/core-app-db
          branch_id: env-dev
          no_expiry: true
          replace_existing: true
      postgres_endpoints:
        dev_endpoint:
          parent: projects/core-app-db/branches/env-dev
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 1
          autoscaling_limit_max_cu: 1
          replace_existing: true

  qa:
    mode: production
    resources:
      postgres_branches:
        qa_branch:
          parent: projects/core-app-db
          branch_id: env-qa
          no_expiry: true
          replace_existing: true
      postgres_endpoints:
        qa_endpoint:
          parent: projects/core-app-db/branches/env-qa
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 1
          autoscaling_limit_max_cu: 1
          replace_existing: true

  stage:
    mode: production
    resources:
      postgres_branches:
        stage_branch:
          parent: projects/core-app-db
          branch_id: env-stage
          no_expiry: true
          replace_existing: true
      postgres_endpoints:
        stage_endpoint:
          parent: projects/core-app-db/branches/env-stage
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 1
          autoscaling_limit_max_cu: 1
          replace_existing: true

  prod:
    mode: production
    resources:
      postgres_branches:
        prod_branch:
          parent: projects/core-app-db
          branch_id: production
          no_expiry: true
          # is_protected: true   # enable on a real prod tier; keep off for POC teardown
          replace_existing: true # REQUIRED: adopt the implicitly created branch

      postgres_endpoints:
        prod_endpoint:
          parent: projects/core-app-db/branches/production
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 1   # match the existing Free Edition project default
          autoscaling_limit_max_cu: 1   # Free Edition cap; raise on paid tiers
          replace_existing: true        # REQUIRED: adopt the implicit primary endpoint
