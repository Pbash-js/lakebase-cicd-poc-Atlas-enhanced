bundle:
  name: lakebase-cicd-poc

# Single live target: prod. (dev/qa/stage stub targets were removed by the
# ponytail audit; re-add them when those workspaces and their Lakebase
# projects exist. Pattern per target: declare the branch + primary endpoint
# with replace_existing: true — DABs cannot adopt an existing postgres_project,
# so the project is never declared in the bundle; its id is recorded here.)
#
# Workspace isolation model: each target is a SEPARATE Databricks workspace
# (own catalog, own identity, own secrets, own Lakebase project) — the same
# commit travels Dev -> Prod through the identical pipeline.

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    resources:
      postgres_branches:
        prod_branch:
          parent: projects/core-app-db
          branch_id: production
          no_expiry: true
          # is_protected: true   # enable on a real prod tier; keep off for POC teardown
          replace_existing: true # REQUIRED: adopt the implicitly created branch

      postgres_endpoints:
        prod_endpoint:
          parent: projects/core-app-db/branches/production
          endpoint_id: primary
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 1   # match the existing Free Edition project default
          autoscaling_limit_max_cu: 1   # Free Edition cap; raise on paid tiers
          replace_existing: true        # REQUIRED: adopt the implicit primary endpoint
