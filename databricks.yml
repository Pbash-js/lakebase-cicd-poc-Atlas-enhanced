bundle:
  name: lakebase-cicd-poc

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production

# The project itself is NOT declared here: DABs cannot adopt an existing
# postgres_project (no replace_existing on that resource) and a second deploy
# would fail with "project already exists". The project is created once (CLI or
# console); the bundle manages branches + endpoints, which DO support adoption.
resources:
  postgres_branches:
    prod_branch:
      parent: projects/core-app-db
      branch_id: production
      no_expiry: true
      # is_protected: true   # enable on a real prod tier; keep off for POC teardown
      replace_existing: true # REQUIRED: adopt the implicitly created branch

  postgres_endpoints:
    prod_endpoint:
      parent: projects/core-app-db/branches/production
      endpoint_id: primary
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      autoscaling_limit_min_cu: 1   # match the existing Free Edition project default
      autoscaling_limit_max_cu: 1   # Free Edition cap; raise on paid tiers
      replace_existing: true        # REQUIRED: adopt the implicit primary endpoint

# cd trigger: also fires on workflow changes

# Atlas CE: stage 1 = atlas migrate apply (CE ledger)
