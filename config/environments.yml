# environments.yml — the single source of truth for environment mapping.
#
# Every CI/CD workflow (cd-promotion, pr-validation, schema-drift-monitor)
# resolves the target workspace, database and deployment gate through this
# file. Moving an environment to another workspace or database is an edit to
# this file only; workflow code never changes.
#
# Fields per environment:
#   git_branch    the git baseline branch that triggers this environment's CD
#   host          NAME of the secret holding the Databricks workspace URL
#   token         NAME of the secret holding that workspace's API token
#   project       Lakebase project id in that workspace
#   database      Lakebase branch inside the project = the database state CD applies to
#   bundle_target databricks.yml target deployed by CD
#   deploy_env    GitHub environment whose required reviewers approve the deploy ("" = deploy on merge)
#
# Current topology (Free Edition): one workspace, one project, one long-lived
# Lakebase branch per environment. Target topology: four workspaces, four
# projects, database "production" in each — reach it by filling in the row
# values (plus a per-workspace host/token secret pair) and nothing else.
#
# NOTE for editors: host/token values are secret NAMES, not secrets. The
# workflows declare every referenced secret as an env var and select the
# value by name at runtime, so adding a workspace = adding one secret pair
# + listing it once in the workflow's env block.

environments:
  dev:
    git_branch: dev
    host: DATABRICKS_HOST
    token: DATABRICKS_TOKEN
    project: core-app-db
    database: env-dev
    bundle_target: dev
    deploy_env: ""

  qa:
    git_branch: qa
    host: DATABRICKS_HOST
    token: DATABRICKS_TOKEN
    project: core-app-db
    database: env-qa
    bundle_target: qa
    deploy_env: ""

  stage:
    git_branch: "release/**"   # glob: any release/x.y line promotes to stage
    host: DATABRICKS_HOST
    token: DATABRICKS_TOKEN
    project: core-app-db
    database: env-stage
    bundle_target: stage
    deploy_env: stage

  prod:
    git_branch: prod
    host: DATABRICKS_HOST
    token: DATABRICKS_TOKEN
    project: core-app-db
    database: production
    bundle_target: prod
    deploy_env: production
